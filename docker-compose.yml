# Local development database only. Synthetic data. No claim of production-grade encryption at rest.
services:
  postgres:
    image: postgres:16-alpine
    container_name: health-capital-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_capital
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d health_capital']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
